[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsx2bpmn"
description = "Таблица процесса <-> BPMN 2.0 XML с координатами. Работает офлайн."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["openpyxl>=3.1", "pillow>=10.0"]

[project.optional-dependencies]
# чтение описаний процесса из docx, pdf, pptx и прочего
docs = ["markitdown[docx,pdf,pptx,xlsx]>=0.1"]

[project.scripts]
xlsx2bpmn = "xlsx2bpmn.cli:main"
bpmn2xlsx = "xlsx2bpmn.cli:main"

[tool.setuptools]
packages = ["xlsx2bpmn"]

[tool.setuptools.dynamic]
# версия одна и та же в пакете и в коде — расходиться им нельзя
version = {attr = "xlsx2bpmn.__version__"}

[tool.setuptools.package-data]
xlsx2bpmn = ["template.xlsx", "prompt.md", "prompt-back.md",
             "DejaVuSans.ttf",
             "layout-node/bundle.mjs", "layout-node/cli.mjs",
             "layout-node/package.json", "layout-node/README.md",
             "layout-node/THIRD-PARTY.md"]
